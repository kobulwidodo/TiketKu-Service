version: "3.9"
services:
  mysql:
    image: mysql:8.0.26

    restart: on-failure
    ports:
      - "3306:3306"
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - "./storage/mysql/scripts:/docker-entrypoint-initdb.d"
      - "./storage/mysql/data:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_TCP_PORT: 3306

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: on-failure
    ports:
      - "5775:5775/udp" # Agent UDP port
      - "6831:6831/udp" # Agent UDP port
      - "6832:6832/udp" # Agent UDP port
      - "5778:5778" # Agent HTTP port
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Collector HTTP port
      - "14250:14250" # Collector gRPC port
      - "9411:9411" # Zipkin port
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    volumes:
      - "./storage/jaeger/data:/tmp"

  redis:
    image: redis:6
    restart: on-failure
    entrypoint:
      - "redis-server"
    volumes:
      - "./storage/redis/conf:/usr/lib/redis/conf"
      - "./storage/redis/modules:/usr/lib/redis/modules"
      - "./storage/redis/data:/data"
    ports:
      - "6379:6379"

  nsqlookupd:
    image: nsqio/nsq
    command: /nsqlookupd
    ports:
      - "4160:4160" # TCP port for clients
      - "4161:4161" # HTTP port for clients
    networks:
      - nsq-network

  nsqd:
    image: nsqio/nsq
    command: /nsqd --broadcast-address=nsqd --lookupd-tcp-address=nsqlookupd:4160
    depends_on:
      - nsqlookupd
    ports:
      - "4150:4150" # TCP port for producers
      - "4151:4151" # HTTP port for producers and consumers
    networks:
      - nsq-network

  nsqadmin:
    image: nsqio/nsq
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    depends_on:
      - nsqlookupd
      - nsqd
    ports:
      - "4171:4171" # HTTP port for NSQ admin UI
    networks:
      - nsq-network

networks:
  nsq-network:
    driver: bridge
